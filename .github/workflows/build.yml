
name: Build Colonel POS V6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          flutter create -t app --platforms=android /tmp/colonel_pos_v6
          cp pubspec.yaml /tmp/colonel_pos_v6/pubspec.yaml
          cp -r lib /tmp/colonel_pos_v6/lib

      - name: Get dependencies
        working-directory: /tmp/colonel_pos_v6
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/colonel_pos_v6
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-pos-v6-apk
          path: /tmp/colonel_pos_v6/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
